<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FEF4E7">
  <title>몬스터 조련단 · 안개 너머의 인연</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M8 8h8l2 12H6zM9 8V5a3 3 0 0 1 6 0v3' fill='%23F2C57A' stroke='%237B6C6D'/%3E%3C/svg%3E">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/pwa/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <header class="topbar"><div><p class="eyebrow">안개 너머의 인연</p><h1>몬스터 조련단</h1></div><span class="currency"><i data-icon="gold"></i><span id="gold">0</span></span></header>
    <section class="tamer-summary" aria-label="조련사 성장"><span>조련사 랭크 <strong id="rank">1</strong></span><div class="xp-track"><div id="rank-fill"></div></div><span id="rank-xp"></span></section>
    <section class="adventure panel">
      <div class="region-heading"><div><h2 id="region-name"></h2><p id="region-subtitle"></p></div><i data-icon="compass"></i></div>
      <div class="stage-heading"><span><strong id="stage-id"></strong> <span id="stage-name"></span></span><span id="timer"></span></div>
      <div class="time-track"><div id="time-fill"></div></div>
      <div id="scene-wrap">
        <div class="scene-top"><span id="wave-label"></span><span>파티 전투력 <b id="cp"></b></span></div>
        <svg id="battle-scene" viewBox="0 60 375 270" role="img" aria-label="조련사와 몬스터 파티가 탐험하는 전투 장면">
          <defs><linearGradient id="dawn" x2="0" y2="1"><stop stop-color="#FEF4E7"/><stop offset="1" stop-color="#E6D8DF"/></linearGradient></defs>
          <g id="background-layer"></g>
          <g id="tamer-layer"><ellipse cx="48" cy="234" rx="24" ry="4" fill="#DCCFD8"/>
            <image id="tamer-image" href="concepts/character/tamer_side.png" x="-25" y="98" width="152" height="144"/>
            <image href="concepts/character/fox_companion.png" x="41" y="216" width="39" height="48"/></g>
          <g id="party-layer"></g><g id="enemy-layer"></g><g id="effect-layer"></g>
        </svg>
        <div id="capture-reveal" aria-live="polite"></div>
        <div id="battle-result" role="status"></div>
        <div class="capture-status"><i data-icon="lantern"></i><span id="capture-status"></span></div>
      </div>
      <div id="tamer-skills" class="tamer-skills"></div>
      <div id="squad-strip" class="squad-strip"></div>
    </section>
    <section class="travel panel">
      <div class="stage-select"><button id="previous-stage" class="icon-button" aria-label="이전 스테이지"><i data-icon="left"></i></button><span>탐험 구역 <strong id="selected-stage"></strong></span><button id="next-stage" class="icon-button" aria-label="다음 스테이지"><i data-icon="right"></i></button></div>
      <div class="mode-buttons"><button id="repeat-mode">반복 탐험</button><button id="challenge-mode">다음 구역 도전</button></div>
      <p id="mode-hint"></p>
    </section>
    <footer class="save-line"><span>골드 <span id="gold-rate"></span> / 초</span><span id="save-status">자동 저장</span></footer>
    <nav class="tabs" aria-label="주 메뉴">
      <button data-tab="adventure" class="selected"><i data-icon="compass"></i><span>탐험</span></button>
      <button data-tab="monsters"><i data-icon="paw"></i><span>몬스터</span></button>
      <button data-tab="camp"><i data-icon="camp"></i><span>캠프</span></button>
      <button data-tab="dex"><i data-icon="book"></i><span>도감</span></button>
      <button data-tab="settings"><i data-icon="settings"></i><span>설정</span></button>
    </nav>
    <div id="toast" role="status"></div>
  </main>
  <dialog id="sheet"><div class="sheet-heading"><h2 id="sheet-title"></h2><button id="close-sheet" class="icon-button" aria-label="닫기"><i data-icon="close"></i></button></div><div id="sheet-content"></div></dialog>
  <dialog id="offline-report" aria-labelledby="report-title"><div class="report-inner"><i data-icon="lantern"></i><p class="eyebrow">다시 만나는 새벽</p><h2 id="report-title">밤새 잡아온 자루</h2><p id="report-time"></p><div id="report-rewards"></div><div id="report-monsters" class="roster-grid"></div><button id="harvest-report" class="primary">모두 수확하기</button></div></dialog>
  <script src="js/data.js"></script>
  <script src="js/data-monsters.js"></script>
  <script src="js/data-art.js"></script>
  <script src="js/data-progression.js"></script>
  <script src="js/data-camp.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/game.js"></script>
  <script src="js/game-monsters.js"></script>
  <script src="js/game-progression.js"></script>
  <script src="js/game-camp.js"></script>
  <script src="js/game-expedition.js"></script>
  <script src="js/game-save.js"></script>
  <script src="js/game-onboarding.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/ui-art.js"></script>
  <script src="js/ui-monsters.js"></script>
  <script src="js/ui-progression.js"></script>
  <script src="js/ui-expedition.js"></script>
  <script src="js/ui-camp.js"></script>
  <script src="js/native.js"></script>
  <script src="js/ui-onboarding.js"></script>
  <script src="js/ui-sound.js"></script>
  <script src="js/pwa.js"></script>
  <script>UI.init();</script>
</body>
</html>
