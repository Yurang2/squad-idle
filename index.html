<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#8FD3FF">
  <meta name="description" content="안개 너머로 나아가는 작은 용병단. 자동 전투와 성장의 첫 번째 원정.">
  <link rel="icon" type="image/png" href="assets/icon/weapon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;700;800&amp;family=Jua&amp;display=swap">
  <link rel="stylesheet" href="style.css">
  <title>용병단 · 첫 번째 원정</title>
</head>
<body>
  <main id="app">
    <header class="hud">
      <div class="brand-row"><h1><span class="brand-mark">⚔</span> 용병단</h1><span class="chapter-label">첫 번째 원정</span><span class="save-state" id="save-status">자동 저장</span></div>
      <div class="resources">
        <div class="resource power"><span class="resource-label"><span data-icon="weapon">⚔</span>전투력</span><strong id="cp">0</strong></div>
        <div class="resource"><span class="resource-label"><span data-icon="gold">🪙</span>골드</span><strong id="gold">0</strong></div>
        <div class="resource"><span class="resource-label"><span data-icon="coin">◆</span>코인</span><strong id="coins">0</strong></div>
      </div>
    </header>
    <section class="expedition" aria-label="자동 전투">
      <div class="stage-header"><div><p id="region-name" class="eyebrow">잊힌 숲</p><h2><span id="stage-id">1-1</span><span class="title-divider">/</span><span id="stage-name">숲의 입구</span></h2></div><div class="clock"><span>남은 시간</span><strong id="timer">60<small>초</small></strong></div></div>
      <div class="time-track"><div id="time-fill"></div></div>
      <div class="battle-scene">
        <div class="scene-topline"><span class="auto-badge"><i></i> 자동 전투 중</span><span id="wave-label">웨이브 1 / 3</span></div>
        <svg id="battle-svg" viewBox="0 0 390 340" preserveAspectRatio="xMidYMid slice" role="img" aria-label="용병과 몬스터의 자동 전투 장면">
          <g id="scene-background"><g class="asset-fallback">
            <defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#8FD3FF"/><stop offset="1" stop-color="#EAF7FF"/></linearGradient></defs>
            <rect width="390" height="340" fill="url(#sky)"/><circle cx="300" cy="72" r="30" fill="#FFC93C"/>
            <path d="M0 187Q80 150 160 185T390 175V340H0Z" fill="#95E888"/>
            <path d="M140 340l30-145h50l75 145" fill="#FFE9B8"/>
            <g fill="#3DDC97" stroke="#4A2C12" stroke-width="3"><path d="M20 180V65m-20 80Q-20 80 25 55q55 35 10 92zM365 180V50m-22 93q-40-55 18-95 60 35 25 93z"/></g>
          </g></g>
          <g id="mercenary-layer"></g><g id="enemy-layer"></g><g id="effect-layer" aria-hidden="true"></g>
        </svg>
        <div id="battle-result" class="battle-result" aria-live="polite"></div>
        <div class="scene-caption"><span class="caption-line"></span><span id="region-subtitle">안개 너머, 첫 번째 원정</span><span class="caption-line"></span></div>
      </div>
      <div id="squad-strip" class="squad-strip" aria-label="용병 상태"></div>
      <div class="harvest-row"><span>이번 원정의 발걸음</span><span><b id="gold-rate">0</b> 골드/초 <span class="rate-divider">·</span> <b id="kill-rate">0</b> 처치/초</span></div>
    </section>
    <section class="stage-controls" aria-label="스테이지 선택과 전투 모드">
      <div id="difficulty-toggle" class="difficulty-toggle" role="group" aria-label="원정 난이도" hidden><button data-difficulty="normal" aria-pressed="true">일반</button><button data-difficulty="chaos" aria-pressed="false">카오스</button></div>
      <div class="stage-navigation"><button id="previous-stage" aria-label="이전 스테이지">‹</button><div><span>스테이지</span><strong id="selected-stage">1-1</strong></div><button id="next-stage" aria-label="다음 스테이지">›</button></div>
      <div class="mode-toggle" role="group" aria-label="전투 모드"><button id="repeat-mode" aria-pressed="false">↻ 반복</button><button id="challenge-mode" class="active" aria-pressed="true">도전 →</button></div>
      <p id="mode-hint">클리어하면 다음 스테이지로 나아갑니다</p>
    </section>
    <nav class="bottom-tabs" aria-label="게임 메뉴">
      <button data-tab="mercenaries" aria-haspopup="dialog"><span data-icon="merc">⚔</span>용병</button>
      <button data-tab="equipment" aria-haspopup="dialog"><span data-icon="hat">♜</span>장비<b id="equipment-badge" hidden>0</b></button>
      <button data-tab="fusion" aria-haspopup="dialog"><span data-icon="fusion">◇</span>합성</button>
      <button data-tab="skills" aria-haspopup="dialog"><span data-icon="skillbook">✧</span>스킬</button>
      <button data-tab="settings" aria-haspopup="dialog"><span data-icon="settings">⚙</span>설정</button>
    </nav>
    <div id="toast" role="status"></div>
    <dialog id="sheet" aria-labelledby="sheet-title"><div class="sheet-grip"></div><div class="sheet-heading"><div><p class="eyebrow">용병단의 기록</p><h2 id="sheet-title">용병</h2></div><button id="close-sheet" aria-label="닫기">×</button></div><div id="sheet-content"></div></dialog>
  </main>
  <script src="js/data.js"></script>
  <script src="js/battle.js"></script>
  <script src="js/game.js"></script>
  <script src="js/game-equipment.js"></script>
  <script src="js/game-expedition.js"></script>
  <script src="js/native.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/ui-art.js"></script>
  <script src="js/ui-equipment.js"></script>
  <script src="js/ui-expedition.js"></script>
</body>
</html>
